<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Music Jukebox — 100% free music for your venue</title>
<meta name="description" content="Free music for cafés, gyms and shops, played by the AXIS camera you already have. Pixabay tracks are free for commercial use — every play is logged with its licence.">
<meta name="theme-color" content="#f5f8fa">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312303f'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23d8f04a'%3E%E2%99%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f8fa;--card:#ffffff;--soft:#eaf1f5;--ink:#14202b;--muted:#52606d;--line:#dbe3e8;--link:#1d5f7d;
  --ok:#17633d;--okbg:#e6f5ec;--warn:#8a3b00;--shadow:0 24px 60px -24px rgba(18,48,63,.45);
  --navy:#12303f;--navy2:#183c4e;--navyline:#2b5164;--navytext:#b9cbd5;--lime:#d8f04a;--limeink:#14202b;
}
[data-theme=dark]{
  --bg:#0d161d;--card:#131f28;--soft:#182833;--ink:#e6edf2;--muted:#a3b3bf;--line:#273541;--link:#8fc4dd;
  --ok:#8fe0b0;--okbg:#14301f;--warn:#f5b26b;--shadow:0 24px 60px -20px rgba(0,0,0,.75);
  --navy:#0a1d27;--navy2:#13303f;--navyline:#24485a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,-apple-system,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3,.stats span,td,th{overflow-wrap:break-word;hyphens:auto}
h1,h2,h3{text-wrap:balance}
.display{font-family:"Bricolage Grotesque",Inter,"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:800;letter-spacing:-.02em}
:lang(ja) .display{letter-spacing:0}
:lang(ja) p,:lang(ja) h1,:lang(ja) h2,:lang(ja) h3,:lang(ja) li,:lang(ja) td{line-break:strict}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:lang(ja) .kicker{text-transform:none;letter-spacing:.04em}
h2.display{margin:10px 0 14px;font-size:clamp(30px,4vw,44px);line-height:1.08}
.sub{margin:0 0 32px;font-size:18px;color:var(--muted);max-width:680px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:700;text-decoration:none;border:1px solid transparent}
.btn.lime{background:var(--lime);color:var(--limeink)}
.btn.out{border-color:var(--line);background:var(--card);color:var(--ink)}
.btn.dark{background:#14202b;color:var(--lime)}
.btn.line{border:1.5px solid #14202b;color:#14202b}
.btn:hover{filter:brightness(.96)}
[hidden]{display:none!important}
/* nav */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{height:64px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;background:#12303f;color:var(--lime);display:grid;place-items:center;font-size:18px}
.navlinks{display:flex;gap:22px;margin-left:12px}
.navlinks a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.navlinks a:hover{color:var(--ink)}
.spacer{flex:1}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.langs button{border:0;background:none;color:var(--muted);font:600 13px/1 Inter,sans-serif;min-height:40px;padding:0 11px;cursor:pointer}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.pill-btn{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
/* hero */
.hero{padding:72px 0 56px}
.hero .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;align-items:center}
.hero .copy{display:flex;flex-direction:column;gap:22px}
.badge{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:var(--okbg);color:var(--ok);font-size:13px;font-weight:700}
h1.display{margin:0;font-size:clamp(38px,5.4vw,64px);line-height:1.02;letter-spacing:-.03em}
:lang(ja) h1.display{line-height:1.2;font-size:clamp(32px,4.4vw,52px)}
.lead{margin:0;font-size:19px;color:var(--muted);max-width:540px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px;max-width:520px}
.stats div{border-top:2px solid var(--ink);padding-top:10px}
.stats b{display:block;font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:32px;font-weight:800;line-height:1.05}
.stats span{font-size:13px;color:var(--muted)}
.stage{position:relative;min-height:470px}
.frame{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.frame .bar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.frame .bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.frame .bar span{margin-left:8px;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.frame img,.popup img{display:block;width:100%;height:auto}
.popup{position:absolute;right:-20px;bottom:0;width:36%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
/* why free (dark band) */
.band{background:var(--navy);color:#e7f0f4}
.band .wrap{padding-top:80px;padding-bottom:80px}
.band .kicker{color:var(--lime)}
.band h2{max-width:760px}
.band .sub{color:var(--navytext)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.licard{background:var(--navy2);border-radius:16px;padding:26px}
.licard .ic{width:40px;height:40px;border-radius:11px;background:var(--lime);color:#12303f;display:grid;place-items:center;margin-bottom:16px}
.licard h3{margin:0 0 6px;font-size:19px}
.licard p{margin:0;color:var(--navytext);font-size:15px}
.rule{margin-top:18px;display:flex;gap:14px;align-items:flex-start;border:1px solid var(--navyline);border-radius:16px;padding:20px 24px}
.rule p{margin:0;color:#d9e5eb;font-size:15px}
.rule b{color:#f0c27a}
/* compare */
section.pad .wrap{padding-top:80px;padding-bottom:80px}
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top}
.cmp{min-width:760px;font-size:15px}
.cmp thead tr{background:var(--soft)}
.cmp thead th{padding:16px 20px;font-size:13px;color:var(--muted);font-weight:700}
.cmp tbody tr{border-top:1px solid var(--line)}
.cmp tbody th{padding:18px 20px;font-weight:700}
.cmp td{padding:18px 20px;color:var(--muted)}
.cmp td.no{color:var(--warn);font-weight:600}
.cmp tr.us{background:var(--okbg)}
.cmp tr.us th{font-weight:800;color:var(--ink)}
.cmp tr.us td{font-weight:700;color:var(--ok)}
.fine{margin:16px 0 0;font-size:13.5px;color:var(--muted);max-width:900px}
/* how */
section.alt{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.step{border:1px solid var(--line);border-radius:16px;padding:26px;background:var(--bg)}
.step .n{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:44px;font-weight:800;line-height:1;color:var(--link)}
.step h3{margin:14px 0 6px;font-size:19px}
.step p{margin:0;color:var(--muted);font-size:15px}
/* proof */
.proof{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:48px;align-items:center}
ul.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;color:var(--muted);font-size:15px}
ul.checks li{display:flex;gap:12px}
ul.checks svg{flex:none;margin-top:3px;stroke:var(--ok)}
ul.checks b{color:var(--ink)}
.logbox{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.loghead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.loghead b{font-size:15px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--okbg);color:var(--ok);font-weight:700;white-space:nowrap}
.log{min-width:520px;font-size:13.5px}
.log thead th{padding:10px 8px;font-weight:600;color:var(--muted)}
.log thead th:first-child,.log td:first-child{padding-left:18px}
.log thead th:last-child,.log td:last-child{padding-right:18px;text-align:right}
.log tbody tr{border-top:1px solid var(--line)}
.log td{padding:11px 8px}
.log td.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.log .tt{font-weight:600}.log .ar{color:var(--muted);font-size:12.5px}
.lic{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--ok);color:var(--ok);white-space:nowrap}
/* install */
ol.inst{margin:0;padding:0;list-style:none;counter-reset:i;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
ol.inst li{counter-increment:i;position:relative;padding:22px 22px 22px 66px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--muted);font-size:15px}
ol.inst li:before{content:counter(i);position:absolute;left:22px;top:20px;width:30px;height:30px;border-radius:9px;background:var(--lime);color:var(--limeink);display:grid;place-items:center;font-weight:800;font-size:14px}
ol.inst b{color:var(--ink)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink);word-break:break-word}
/* cta + footer */
.kofibtn{display:inline-flex;align-items:center}
.kofibtn img{display:block}
.cta{border-radius:22px;background:var(--lime);color:#14202b;padding:48px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.cta div:first-child{flex:1 1 420px}
.cta h2{margin:0 0 8px;font-size:clamp(28px,3.6vw,40px);line-height:1.08}
.cta p{margin:0;font-size:17px;color:#35402b}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-top:32px;padding-bottom:48px;display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between;font-size:13.5px;color:var(--muted)}
footer b{color:var(--ink)}
footer p{margin:0}
@media (max-width:920px){
  .navlinks{display:none}
  .hero .grid,.proof,ol.inst{grid-template-columns:minmax(0,1fr)}
  .cards3{grid-template-columns:minmax(0,1fr)}
  .hero{padding-top:40px}
  .stage{min-height:0}
  .popup{position:static;width:62%;margin:-48px 0 0 auto}
  .cta{padding:32px}
}
@media (max-width:560px){
  header.top .wrap{gap:10px}
  .brand span:last-child{display:none}
  .langs button{padding:0 8px}
  .stats b{font-size:26px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top"><span class="logo">♫</span><span>Free Music Jukebox</span></a>
    <nav class="navlinks" aria-label="Sections">
      <a href="#free" data-i18n="nav_free"></a><a href="#compare" data-i18n="nav_compare"></a><a href="#how" data-i18n="nav_how"></a><a href="#proof" data-i18n="nav_proof"></a>
    </nav>
    <div class="spacer"></div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="cs">CZ</button><button type="button" data-lang="ja">JP</button><button type="button" data-lang="de">DE</button>
    </div>
    <button class="pill-btn" id="theme" type="button"></button>
    <a class="pill-btn" href="#" data-cfg="repo" hidden>GitHub</a>
  </div>
</header>

<main id="top">
<section class="hero">
  <div class="wrap grid">
    <div class="copy">
      <div class="badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="badge"></span></div>
      <h1 class="display" data-i18n="title"></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="ctas">
        <a class="btn lime" href="#install" data-cfg="release" data-i18n="cta_get"></a>
        <a class="btn out" href="#compare" data-i18n="cta_compare"></a>
      </div>
      <div class="stats">
        <div><b data-i18n="stat1_v"></b><span data-i18n="stat1"></span></div>
        <div><b data-i18n="stat2_v"></b><span data-i18n="stat2"></span></div>
        <div><b data-i18n="stat3_v"></b><span data-i18n="stat3"></span></div>
      </div>
    </div>
    <div class="stage">
      <div class="frame">
        <div class="bar"><i></i><i></i><i></i><span>axis-q1656.local · Free Music Jukebox</span></div>
        <img data-shot="camera" width="1280" height="720" alt="">
      </div>
      <div class="popup"><img data-shot="popup" width="360" height="760" alt=""></div>
    </div>
  </div>
</section>

<section id="free" class="band">
  <div class="wrap">
    <div class="kicker" data-i18n="free_kicker"></div>
    <h2 class="display" data-i18n="free_title"></h2>
    <p class="sub" data-i18n="free_sub"></p>
    <div class="cards3">
      <div class="licard"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9l2.5-5h13L21 9"/><path d="M12 13v4"/></svg></div><h3 data-i18n="lic1_t"></h3><p data-i18n="lic1_d"></p></div>
      <div class="licard"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div><h3 data-i18n="lic2_t"></h3><p data-i18n="lic2_d"></p></div>
      <div class="licard"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></div><h3 data-i18n="lic3_t"></h3><p data-i18n="lic3_d"></p></div>
    </div>
    <div class="rule"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0c27a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.5"/></svg><p><b data-i18n="rule_b"></b> <span data-i18n="rule_t"></span></p></div>
  </div>
</section>

<section id="compare" class="pad">
  <div class="wrap">
    <div class="kicker" data-i18n="cmp_kicker"></div>
    <h2 class="display" data-i18n="cmp_title"></h2>
    <p class="sub" data-i18n="cmp_sub"></p>
    <div class="tbox">
      <table class="cmp">
        <thead><tr><th scope="col" style="width:24%"></th><th scope="col" data-i18n="th_cost"></th><th scope="col" data-i18n="th_ok"></th><th scope="col" data-i18n="th_hw"></th><th scope="col" data-i18n="th_proof"></th></tr></thead>
        <tbody>
          <tr><th scope="row" data-i18n="r1_name"></th><td data-i18n="r1_cost"></td><td class="no" data-i18n="r1_ok"></td><td data-i18n="r1_hw"></td><td data-i18n="r1_proof"></td></tr>
          <tr><th scope="row" data-i18n="r2_name"></th><td data-i18n="r2_cost"></td><td data-i18n="r2_ok"></td><td data-i18n="r2_hw"></td><td data-i18n="r2_proof"></td></tr>
          <tr class="us"><th scope="row">Free Music Jukebox + Pixabay</th><td data-i18n="stat1_v"></td><td data-i18n="r3_ok"></td><td data-i18n="r3_hw"></td><td data-i18n="r3_proof"></td></tr>
        </tbody>
      </table>
    </div>
    <p class="fine" data-i18n="cmp_note"></p>
  </div>
</section>

<section id="how" class="alt pad">
  <div class="wrap">
    <div class="kicker" data-i18n="how_kicker"></div>
    <h2 class="display" data-i18n="how_title" style="margin-bottom:36px"></h2>
    <div class="cards3">
      <div class="step"><div class="n">01</div><h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p></div>
      <div class="step"><div class="n">02</div><h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p></div>
      <div class="step"><div class="n">03</div><h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p></div>
    </div>
  </div>
</section>

<section id="proof" class="pad">
  <div class="wrap proof">
    <div>
      <div class="kicker" data-i18n="proof_kicker"></div>
      <h2 class="display" data-i18n="proof_title"></h2>
      <p class="sub" data-i18n="proof_sub" style="margin-bottom:18px"></p>
      <ul class="checks">
        <li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="p1"></span></li>
        <li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="p2"></span></li>
        <li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="p3"></span></li>
      </ul>
    </div>
    <div class="logbox">
      <div class="loghead"><b data-i18n="log_title"></b><div class="spacer"></div><span class="chip" data-i18n="log_ok"></span></div>
      <div style="overflow-x:auto">
        <table class="log">
          <thead><tr><th scope="col" data-i18n="log_start"></th><th scope="col" data-i18n="log_track"></th><th scope="col" data-i18n="log_lic"></th><th scope="col" data-i18n="log_sec"></th></tr></thead>
          <tbody id="logrows"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<section id="install" class="alt pad">
  <div class="wrap">
    <div class="kicker" data-i18n="inst_kicker"></div>
    <h2 class="display" data-i18n="inst_title"></h2>
    <p class="sub" data-i18n="inst_sub"></p>
    <ol class="inst"><li data-i18n="i1"></li><li data-i18n="i2"></li><li data-i18n="i3"></li><li data-i18n="i4"></li></ol>
  </div>
</section>

<section class="pad">
  <div class="wrap">
    <div class="cta">
      <div><h2 class="display" data-i18n="cta_title"></h2><p data-i18n="cta_sub"></p></div>
      <div class="ctas" style="margin:0">
        <a class="btn dark" href="#install" data-cfg="release" data-i18n="cta_dl"></a>
        <a class="kofibtn" href="#" data-cfg="kofi" target="_blank" hidden><img height="36" style="border:0px;height:36px;" src="https://storage.ko-fi.com/cdn/kofi6.png?v=6" border="0" data-i18n-alt="cta_kofi" alt="Buy Me a Coffee at ko-fi.com"></a>
      </div>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">

const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let theme = store.get('fmj-site-theme') || 'light';
let lang = 'en';

function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = store.get('fmj-site-lang');
  const nav = (navigator.language || 'en').slice(0, 2);
  for (const c of [q, saved, nav]) if (c && T[c]) return c;
  return 'en';
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.innerHTML = t[el.dataset.i18n] ?? T.en[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-alt]').forEach((el) => { el.alt = t[el.dataset.i18nAlt] ?? T.en[el.dataset.i18nAlt]; });
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.getElementById('theme').textContent = theme === 'dark' ? t.light : t.dark;
  document.querySelectorAll('img[data-shot]').forEach((img) => { img.src = `assets/${img.dataset.shot}-${theme}.webp`; img.alt = t[`alt_${img.dataset.shot}`]; });
  document.getElementById('logrows').innerHTML = LOG.map(([time, title, artist, sec]) =>
    `<tr><td class="num">${time}</td><td><div class="tt">${esc(title)}</div><div class="ar">${esc(artist)}</div></td><td><span class="lic">Pixabay Content License</span></td><td class="num">${sec}</td></tr>`).join('');
}

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name=theme-color]').content = theme === 'dark' ? '#0d161d' : '#f5f8fa';
}

// optional links: GitHub/Ko-fi hidden and download pointing to #install until CONFIG is filled in
const links = { repo: CONFIG.repo, release: CONFIG.repo && CONFIG.repo.replace(/\/$/, '') + '/releases/latest', kofi: CONFIG.kofi };
document.querySelectorAll('[data-cfg]').forEach((a) => {
  const href = links[a.dataset.cfg];
  if (href) { a.href = href; a.hidden = false; a.rel = 'noopener'; }
});

document.querySelectorAll('.langs button').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang; store.set('fmj-site-lang', lang);
  const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  render();
});
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('fmj-site-theme', theme); applyTheme(); render(); };

lang = pickLang();
applyTheme();
render();
</script>
